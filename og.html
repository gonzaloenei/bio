<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>og</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://use.typekit.net/hal0ftj.css">
  <!-- Same stylesheet as the site, so the marks stay aspect-locked and sized
       in em — they scale with the larger type here without any retuning. -->
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-size: 38px;
      line-height: 1.55;
      display: flex;
      align-items: center;
      padding: 0 120px;
    }
    /* Chrome's widow avoidance — stops the block ending on a lone word.
       Doing this in CSS rather than by tuning the font size means it still
       holds after the copy is edited. */
    p { text-wrap: pretty; }
    /* Each mark stays glued to the word it belongs to, so a line break can
       never strand a logo at the end of a line away from its name. */
    .nb { white-space: nowrap; }
  </style>
</head>
<body>
  <p>I co-founded <span class="nb"><img class="logo logo-faces" src="logos/faces.svg" alt="" aria-hidden="true"><a href="https://faces.app">Faces</a></span>, a presentations platform where every slide is a software artifact. We built several other <span class="nb"><img class="logo logo-perhaps" src="logos/perhaps.svg" alt="" aria-hidden="true"><a href="https://perhaps.inc">AI-native</a></span> <a href="https://perhaps.inc">products</a>, including a <span class="nb"><img class="logo logo-workspace" src="logos/workspace.png" alt="" aria-hidden="true"><a href="https://workspace.faces.site/">Workspace</a></span> where every tool was usable by humans and agents, and an extension that generated <span class="nb"><img class="logo logo-interfaces" src="logos/interfaces.png" alt="" aria-hidden="true"><a href="https://x.com/gopalkraman/status/1883248141853696016">Interfaces</a></span> using the web.</p>
</body>
</html>
