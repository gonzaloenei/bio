<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/seville/">
<title>figaro</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="seville.css">
<style>
  /* One short scroll: the name gives way to the promise. */
  .scroller { height: 260vh; height: 260svh; position: relative; }
  .hero { position: sticky; top: 0; }
  /* Full height, sides cropped; nudged right of centre so Figaro and the dog both fit on a phone. No camera moves: only the words change. */
  .stage { transform: translateX(-51.1%); }
  .cloud { position: absolute; will-change: transform; user-select: none; -webkit-user-drag: none; }
  .titles { position: absolute; z-index: 20; left: 0; right: 0; top: clamp(56px, 13svh, 140px); padding: 0 24px; text-align: center; pointer-events: none; color: #fff; --size: clamp(64px, 19vw, 126px); }
  .titles .perch { position: absolute; z-index: -1; left: 50%; top: calc(var(--size) * .92); width: min(84vw, 560px); padding: 0; transform: translateX(-50%); opacity: .95; will-change: transform; }
  .titles > :not(.perch) { position: absolute; left: 24px; right: 24px; top: 0; margin: 0; padding: .1em 0 .2em; will-change: opacity, transform, filter; }
  .titles h1 { font: 400 var(--size)/1.15 Gelica, Georgia, serif; text-transform: lowercase; letter-spacing: .01em; }
  .titles h2 { font: 400 clamp(34px, 9.5vw, 64px)/1.15 Gelica, Georgia, serif; opacity: 0; max-width: 12ch; margin: 0 auto; }
</style>
</head>
<body>
<div class="scroller" id="scroller">
  <section class="hero">
    <div class="stage" id="stage"></div>
    <div class="titles" id="titles">
      <img class="perch" id="perch" src="assets/cloud-4.png" alt="">
      <h1 id="title">figaro</h1>
      <h2 id="sub">Your family's right hand man</h2>
    </div>
  </section>
</div>

<script type="module">
import { BOX, BASE, CLOUDS, place, img, clamp, lerp, ease, seg, prefersReducedMotion } from './stage.js';

const stage = document.getElementById('stage');
const skyWrap = document.createElement('div'); skyWrap.className = 'layer sky';
skyWrap.appendChild(img('sky.jpg'));
stage.appendChild(skyWrap);
const clouds = CLOUDS.filter(k => k !== 'cloud-4').map((key, i) => {
  const el = place(img(`${key}.png`, 'cloud'), key);
  skyWrap.appendChild(el);
  const [x0, , x1] = BOX[key], w = x1 - x0;
  return { el, x0, w, dx: 0, vx: 0, phase: i * 1.3, near: clamp(w / 600, 0.4, 1.1) * (0.7 + BOX[key][1] / 1200) };
});
stage.append(img('plate-fg.webp', 'layer'), place(img('dog.png', ''), 'dog'), place(img('figaro.png', ''), 'figaro'));

const scroller = document.getElementById('scroller');
const perch = document.getElementById('perch'), title = document.getElementById('title'), sub = document.getElementById('sub');
let prog = 0, last = performance.now(), lastScroll = scrollY, wind = 0;
const BREEZE = prefersReducedMotion ? 4 : 14;

function frame(now) {
  const dt = Math.min(50, now - last) / 1000; last = now;
  const max = Math.max(1, scroller.offsetHeight - innerHeight);
  prog += (clamp(scrollY / max, 0, 1) - prog) * (prefersReducedMotion ? 1 : 0.14);
  const p = prog;

  // "figaro" lifts away and softens…
  const out = ease(seg(p, 0.05, 0.38));
  title.style.opacity = 1 - out;
  title.style.transform = `translateY(${-28 * out}px) scale(${1 - out * 0.06})`;
  title.style.filter = `blur(${out * 6}px)`;
  // …then the promise settles in where it was.
  const inn = ease(seg(p, 0.42, 0.78));
  sub.style.opacity = inn;
  sub.style.transform = `translateY(${22 * (1 - inn)}px)`;
  sub.style.filter = `blur(${(1 - inn) * 6}px)`;

  // Clouds drift on a breeze; a flick of the thumb blows them along.
  const sv = scrollY - lastScroll; lastScroll = scrollY;
  wind = wind * 0.9 + clamp(sv, -120, 120) * (prefersReducedMotion ? 0 : 0.6);
  const k = stage.clientWidth / BASE.w;
  for (const c of clouds) {
    c.vx = (c.vx + wind * c.near * 0.15) * 0.965;
    c.dx += (BREEZE * c.near + c.vx) * dt;
    if (c.x0 + c.dx > BASE.w + 60) c.dx -= BASE.w + c.w + 120;
    if (c.x0 + c.dx + c.w < -60) c.dx += BASE.w + c.w + 120;
    const bob = prefersReducedMotion ? 0 : Math.sin(now / 3000 + c.phase) * 3;
    c.el.style.transform = `translate(${c.dx * k}px, ${bob * k}px)`;
  }
  // The perched cloud just breathes under the words, and leans with a flick of the thumb.
  // As the two-line subtitle arrives, the cloud sinks a little so the words still sit on top of it.
  const sink = Math.max(0, sub.offsetHeight - title.offsetHeight + 16) * inn;
  perch.style.transform = `translate(calc(-50% + ${clamp(wind * 0.4, -30, 30)}px), ${sink + (prefersReducedMotion ? 0 : Math.sin(now / 2600) * 4)}px)`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
